[project]
name = "launchlint"
version = "0.1.0"
description = "Local-first pre-launch audit CLI for static sites. Catches SEO, broken links, accessibility, and config issues before they ship."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "chemico0531", email = "chemico0531@users.noreply.github.com" }
]
keywords = ["seo", "audit", "launch", "lighthouse", "pre-merge", "cli", "static-site"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Quality Assurance",
]

# Core deps kept minimal — stdlib-first philosophy.
# requests is the only third-party HTTP client (mature, ubiquitous).
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.scripts]
launchlint = "launchlint.__main__:main"

[project.urls]
Homepage = "https://github.com/chemico0531/launchlint"
Repository = "https://github.com/chemico0531/launchlint"
Issues = "https://github.com/chemico0531/launchlint/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/launchlint"]

[tool.hatch.build.targets.sdist]
include = [
    "src/launchlint",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]