name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('projects/launchlint/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install project and test dependencies
        run: uv sync --dev --frozen
        working-directory: projects/launchlint

      - name: Lint
        run: uv run ruff check src tests
        working-directory: projects/launchlint

      - name: Type check
        run: uv run pyright src
        working-directory: projects/launchlint

      - name: Test with coverage
        run: uv run pytest --cov=src --cov-fail-under=80 --cov-report=term-missing tests/
        working-directory: projects/launchlint
